<section class="reviews" id="reviews">
  <div class="container">
    <div class="section-head reveal" appReveal>
      <p class="eyebrow">{{ t[currentLanguage].reviews.eyebrow }}</p>
      <h2>{{ t[currentLanguage].reviews.title }}</h2>
    </div>

    <div class="review-grid">
      @for (review of reviews; track review.name) {
        <div class="review-card reveal" appReveal>
          <p class="quote-mark">"</p>
          <p class="testimonial">{{ t[currentLanguage].reviews.items[review.key].quote }}</p>
          <div class="stars">★★★★★</div>
          <div class="reviewer">
            <img [src]="review.img" [alt]="review.name" />
            <div>
              <strong>{{ review.name }}</strong>
              <span>{{ t[currentLanguage].reviews.items[review.key].meta }}</span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
