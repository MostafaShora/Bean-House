<section class="hero" id="home">
  <div class="container">
    <div class="hero-content">
      <p class="eyebrow">{{ t[currentLanguage].hero.eyebrow }}</p>
      <h1>{{ t[currentLanguage].hero.title }}<br><em>{{ t[currentLanguage].hero.titleEmphasis }}</em></h1>
      <p>{{ t[currentLanguage].hero.description }}</p>
      <div class="hero-actions">
        <a href="#products" class="btn btn-primary">{{ t[currentLanguage].hero.exploreBtn }}</a>
        <a href="#about" class="btn btn-outline">{{ t[currentLanguage].hero.storyBtn }}</a>
      </div>
    </div>
  </div>

  <svg class="steam" viewBox="0 0 120 220" aria-hidden="true">
    <path d="M30 200 C 10 160, 50 140, 30 100 C 10 60, 50 40, 40 10"/>
    <path d="M60 200 C 40 160, 80 140, 60 100 C 40 60, 80 40, 70 10"/>
    <path d="M90 200 C 70 160, 110 140, 90 100 C 70 60, 110 40, 100 10"/>
  </svg>

  <div class="scroll-cue"><span></span>{{ t[currentLanguage].hero.scroll }}</div>
</section>
